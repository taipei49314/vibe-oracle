name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test server
        run: npm run test -w server
      - name: Prompt / policy assertions (promptfoo-compatible lock)
        run: npm run eval:prompts
      - name: Build server
        run: npm run build -w server
      - name: Build client
        run: npm run build -w client

  # Optional full promptfoo on Linux (may need network for npx cache).
  # continue-on-error lives on the step: a job-level flag still marks the
  # commit's check run as failed, which reads as a red default branch.
  promptfoo-optional:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: promptfoo eval (best-effort)
        continue-on-error: true
        run: npx --yes promptfoo@0.103.12 eval -c eval/promptfooconfig.yaml --no-cache
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
